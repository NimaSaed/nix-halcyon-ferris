# Dongle-only Kconfig options.

# Radio time for the touchpad half. The dongle runs one BLE connection per
# half, both at the 7.5 ms interval ZMK asks for. Zephyr's controller places
# the second connection's events right after the first one's reserved slot
# (about 1 ms, the time of a single packet exchange), and a connection event
# that still has data is cut short when the other connection's event starts.
# So whichever half connected first only gets ~1 ms out of every 7.5 ms,
# i.e. one or two notifications per connection event, while the other gets
# ~6 ms. When that first half is the one with the touchpad, the link cannot
# keep up with its stream, the right half's send queue fills (lagging
# cursor), then drops. Spacing the two connections 3 ms apart gives each
# half at least 3 ms per interval whichever connected first.
# (BT_CTLR_ADVANCED_FEATURES only makes the controller's advanced options
# settable from here; without it Kconfig silently keeps the default 0.)
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_CENTRAL_SPACING=3000

# Touchpad event capacity on the central. The right half sends one BLE
# notification per Cirque packet (&zip_xy_pack, up to 100/s; it was two per
# packet, REL_X and REL_Y+sync, before the packing). With the defaults the
# dongle could acknowledge only one packet per connection event
# (BT_CTLR_RX_BUFFERS=1) and queued the result in a 5-entry queue that
# drops silently when full, then a 16-entry input queue. Kept large so a
# burst after a stalled connection event is absorbed instead of dropped.
CONFIG_BT_CTLR_RX_BUFFERS=6
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=64
# Larger than the queue above: the central drains that whole queue into this
# one in a single pass, and &zip_xy_unpack re-injects one REL_Y per packet
# into it.
CONFIG_INPUT_QUEUE_MAX_MSGS=96

# Input thread stack. Zephyr's input thread runs the whole touchpad chain on
# the dongle (unpack, scaler, temp layer, then the USB HID send); another
# Cirque split (beekeeb Toucan) measured it overflowing its default stack
# under sustained trackpad use, and ZMK builds have no MPU stack guard, so an
# overflow would corrupt memory silently. 4096 costs 3 KB of the 177 KB of
# RAM that are free; the "stack free" figure in the xy_unpack log line (see
# below) shows how much of it is actually used.
CONFIG_INPUT_THREAD_STACK_SIZE=4096

# USB logging (README "Getting logs"): the dongle enumerates a second USB
# serial port next to ZMK Studio's; capture with scripts/zmk-log.sh. ZMK
# itself is kept at WRN (ZMK_LOGGING_MINIMAL drops it from DEBUG, which would
# log every touchpad event); the xy-pack module logs its own one-line
# summary per second of traffic, and Zephyr's thread analyzer prints every
# thread's stack high-water mark every 30 s. Comment this block out when
# done.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_ZMK_INPUT_PROCESSOR_XY_PACK_STATS=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30
