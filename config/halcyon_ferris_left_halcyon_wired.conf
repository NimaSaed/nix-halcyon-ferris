# Left half, wired board only (<shield>_<board>.conf, loaded next to
# halcyon_ferris.conf and halcyon_wired.conf for this board only). The
# central: keys, e-paper, and the receiving end of the right half's touchpad
# (see halcyon_ferris_left_halcyon_wired.overlay). The halcyon_ferris_left
# shield defaults to central, so nothing to set for that.

# E-paper: splitkb's status widget (artwork, battery gauge, BLE profile
# circles, layer name) is written for the wireless board and does not
# compile without Bluetooth and a battery (widgets/status.c calls zmk_ble_*
# and zmk_battery_state_of_charge and uses CONFIG_BT_MAX_PAIRED unguarded),
# so ZMK's built-in status screen for now: layer name and words per minute.
# Known flaw: it draws in the panel's native orientation and the module is
# mounted a quarter turn off, so the text runs sideways.
# (mod_display_epaper_forest.conf selects the custom screen and turns the
# layer widget off; these come later in the merge and override it.)
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_HALCYON_EPAPER_WIDGET_STATUS=n
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# E-paper latency. ZMK renders and hands pending changes to the panel once
# per tick; splitkb's e-paper shield sets the tick to 1000 ms (ZMK's default
# is 10 ms, meant for OLEDs), so a layer change could wait up to a second
# before the panel even starts. At 100 ms it starts within a tenth of a
# second. What remains is the panel's own partial refresh, a few hundred ms,
# set by the waveform (LUT) in splitkb's devicetree, not touched here.
# The cost: a momentary layer (a held thumb key) now reliably shows as two
# refreshes, on and off; raise this back towards 1000 if that flicker while
# typing annoys more than the lag did. The wireless left half is a
# peripheral, shows no layer, and runs on a coin cell: it keeps splitkb's
# 1000 ms.
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=100
