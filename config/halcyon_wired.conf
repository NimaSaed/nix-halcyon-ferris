# Both halves of the wired build (<board>.conf: ZMK loads it for every part
# built for the halcyon_wired board, after halcyon_ferris.conf).
#
# The wired keyboard has no dongle: the left half is the central and the
# right half the peripheral, over the UART on the USB-C cable between the
# halves. No BLE, no battery, so none of the wireless tuning applies.

# RGB underglow. This is splitkb's boards/shields/halcyon_ferris/boards/
# halcyon_wired.conf, which Zephyr never applies for the halcyon_wired//zmk
# board target (misnamed, see halcyon_wired.dtsi, which carries the strip's
# devicetree side). Drop once splitkb renames their file.
#
# Off at boot, like the wireless halves (splitkb's wired file has it on;
# &rgb_ug RGB_TOG on the Func layer turns it on). ON_START only applies
# when no state has been saved yet: a toggle is written to flash
# CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE (60 s) after the last change, and these
# halves lose power when unplugged, so a toggle followed by an unplug within
# a minute is forgotten and the next boot is back to this default.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
# Colour when turned on: a solid light blue (ZMK's default is solid red;
# hue 0-359, saturation 0-100, lower = paler). Same saved-state caveat as
# above: these only apply until the first saved change (RGB_HUD/HUI,
# RGB_SAD/SAI on the Func layer, or any effect change).
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=200
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=60

# USB remote wakeup, so a keypress on the left half wakes a suspended host.
# Zephyr only advertises the capability (config descriptor bmAttributes
# bit 5) when this is set; the nRF driver implies it, the RP2040 one does
# not, so without it the host never enables wakeup on the device (Linux
# shows an empty power/wakeup) and ZMK's usb_wakeup_request() on a keypress
# during suspend returns -ENOTSUP. The host has to opt in as well: peanut
# does so with a udev rule (nix-config hosts/peanut/default.nix,
# 60-zmk-wakeup.rules), since usbhid only does it by itself for
# boot-protocol keyboards and CONFIG_ZMK_USB_BOOT is off.
CONFIG_USB_DEVICE_REMOTE_WAKEUP=y

# Input thread stack, same reasoning as in halcyon_ferris_dongle.conf: the
# left half runs the whole touchpad chain (scaler, temp layer, USB HID send)
# on Zephyr's input thread; on the right half it only carries the Cirque
# driver's events into the split transport.
CONFIG_INPUT_THREAD_STACK_SIZE=4096
