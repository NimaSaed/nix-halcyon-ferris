# Right half, wireless board only (the half with the Cirque touchpad;
# <shield>_<board>.conf, the wired build never sees it: everything below is
# about the BLE link, except the pinnacle-tune block, which the wired right
# half repeats in halcyon_ferris_right_halcyon_wired.conf).

# Touchpad event capacity on the peripheral. With &zip_xy_pack
# (halcyon_ferris_right_halcyon_wireless.overlay) each Cirque packet is one BLE notification,
# up to 100/s (it was two, REL_X and REL_Y+sync, before). With the default 3
# ACL/L2CAP/ATT TX buffers only three notifications could be in flight per
# 7.5 ms connection event; 8 lets a burst after a stalled connection event
# drain in one go. See also halcyon_ferris_dongle.conf.
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_ATT_TX_COUNT=8
# Cirque registers beyond Zephyr's driver (modules/pinnacle-tune, logs the
# before/after values at boot under "pinnacle_tune"). Edge sensitivity: the
# WideZ-min values Cirque uses for curved overlays, so a lighter finger stays
# detected at the rim (the driver's "sensitivity" is the ADC gain, already
# at its maximum "1x"). CALCONFIG1_CLEAR / FEEDCONFIG3_SET are the chip's
# compensation and feature bits, for the next experiments (see the module's
# Kconfig for the bit values); 0 = unchanged.
CONFIG_PINNACLE_TUNE=y
CONFIG_PINNACLE_TUNE_EDGE_SENSITIVITY=y
# Experiment: NERD (0x04), track-error (0x08) and palm-error (0x20)
# compensation off; background (0x02) and tap (0x10) stay on.
CONFIG_PINNACLE_TUNE_CALCONFIG1_CLEAR=0x2C
CONFIG_PINNACLE_TUNE_FEEDCONFIG3_SET=0x00

# The send queue in front of those buffers. ZMK's default (32) now holds
# 320 ms of packets; the previous 128 let the cursor lag the finger by over a
# second when the link fell behind, which looked worse than dropping the
# oldest packets. Since a queue entry is now a whole packet, a drop can no
# longer tear a packet's X from its Y.
CONFIG_ZMK_INPUT_SPLIT_MSG_QUEUE_SIZE=32

# Input thread stack, see halcyon_ferris_dongle.conf. The peripheral's input
# thread only runs the Cirque driver's events through &zip_xy_pack into the
# split transport, so this is just the same headroom (213 KB of RAM free).
CONFIG_INPUT_THREAD_STACK_SIZE=4096

# USB logging while the half is on a USB cable (README "Getting logs"):
# shows "Input event queue full" / "Error notifying input event" from the
# BLE send path (the link is behind), errors from the Cirque driver, and
# the xy-pack module's one-line summary per second of traffic; Zephyr's
# thread analyzer prints every thread's stack high-water mark every 30 s.
# Comment out when done.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_ZMK_INPUT_PROCESSOR_XY_PACK_STATS=y
# Every packet, for short controlled gestures only (see README "Getting logs").
# CONFIG_ZMK_INPUT_PROCESSOR_XY_PACK_TRACE=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30
