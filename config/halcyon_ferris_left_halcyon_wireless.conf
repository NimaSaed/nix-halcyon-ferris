# Left half, wireless board only (<shield>_<board>.conf: ZMK loads it next
# to halcyon_ferris.conf for this board, the wired build never sees it).
# With a dongle, the left half is a peripheral (the halcyon_ferris_left
# shield defaults to central).
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Input thread stack, same headroom as the dongle and the right half (see
# halcyon_ferris_dongle.conf). This half has no pointing device, so its input
# thread is idle; this only keeps the three parts alike.
CONFIG_INPUT_THREAD_STACK_SIZE=4096

# USB logging while the half is on a USB cable (README "Getting logs"):
# ZMK warnings/errors from the BLE send path and the key matrix, and
# Zephyr's thread analyzer printing every thread's stack high-water mark
# every 30 s (this half runs the e-paper display's own work queue on top of
# the usual threads). Comment out when done.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_THREAD_NAME=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30
