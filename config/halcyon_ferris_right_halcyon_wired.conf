# Right half, wired board only (the half with the Cirque touchpad;
# <shield>_<board>.conf, loaded next to halcyon_ferris.conf and
# halcyon_wired.conf for this board only).

# Cirque registers beyond Zephyr's driver (modules/pinnacle-tune, logs the
# before/after values at boot under "pinnacle_tune"). Same values as the
# wireless right half, see halcyon_ferris_right_halcyon_wireless.conf for
# the reasoning; change them in both places.
CONFIG_PINNACLE_TUNE=y
CONFIG_PINNACLE_TUNE_EDGE_SENSITIVITY=y
CONFIG_PINNACLE_TUNE_CALCONFIG1_CLEAR=0x2C
CONFIG_PINNACLE_TUNE_FEEDCONFIG3_SET=0x00
